# CI for todoist-tui (T-008, EPIC-01).
#
# Triggers: push + pull_request against the repository's default branch,
# ASSUMED to be `develop` — the lead must confirm the remote's actual default
# branch and adjust the two `branches:` lists below if it differs (e.g. main).
#
# Job names (fmt, clippy, test, build) are stable/generic on purpose:
# EPIC-12 extends these jobs later, so do not rename them.
#
# Toolchain policy: no version is hard-coded here. The pinned toolchain
# (channel + components + profile) comes from rust-toolchain.toml in the repo
# root, installed by actions-rust-lang/setup-rust-toolchain.
name: ci

# Quoted so YAML 1.1 parsers (e.g. PyYAML) also read it as the key "on".
"on":
  push:
    branches: [develop]
  pull_request:
    branches: [develop]

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: fmt
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: todoist-tui
      - run: cargo fmt --all -- --check

  clippy:
    name: clippy
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: todoist-tui
      # Lint policy lives in Cargo.toml [lints.*] + clippy.toml (T-002);
      # warnings must not accumulate in CI, so deny them here.
      - run: cargo clippy --all-targets -- -D warnings

  test:
    name: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: todoist-tui
      - run: cargo test --all

  build:
    name: build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: todoist-tui
      - run: cargo build --release

  # Proves the packaging promise end to end (T-1108, EPIC-12): a plain
  # `cargo install --path .` (as an end user who ran `cargo package`/
  # published the crate would do) produces a working, self-contained
  # single binary. `--locked` guards against Cargo.lock drift; installing
  # into a throwaway `$(mktemp -d) --root` keeps this hermetic and avoids
  # polluting the runner's cargo home.
  install:
    name: install
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: todoist-tui
      - name: cargo install --path . --locked
        run: |
          INSTALL_ROOT="$(mktemp -d)"
          echo "INSTALL_ROOT=$INSTALL_ROOT" >> "$GITHUB_ENV"
          cargo install --path . --locked --root "$INSTALL_ROOT"
      - name: Verify --version
        run: |
          VERSION="$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)"
          OUTPUT="$("$INSTALL_ROOT/bin/todoist-tui" --version)"
          echo "binary says: $OUTPUT"
          echo "$OUTPUT" | grep -F "$VERSION"
      # Machine-checks the rustls-only / bundled-sqlite promise (REQ-001):
      # the installed binary must not dynamically link OpenSSL or the
      # system SQLite library on either platform.
      - name: Verify no libssl/libsqlite3 dynamic dependency (Linux)
        if: runner.os == 'Linux'
        run: |
          ldd "$INSTALL_ROOT/bin/todoist-tui" | tee /tmp/ldd-output.txt
          if grep -Eq 'libssl|libcrypto|libsqlite3' /tmp/ldd-output.txt; then
            echo "::error::found forbidden dynamic dependency (libssl/libcrypto/libsqlite3)"
            exit 1
          fi
      - name: Verify no libssl/libsqlite3 dynamic dependency (macOS)
        if: runner.os == 'macOS'
        run: |
          otool -L "$INSTALL_ROOT/bin/todoist-tui" | tee /tmp/otool-output.txt
          if grep -Eq 'libssl|libcrypto|libsqlite3' /tmp/otool-output.txt; then
            echo "::error::found forbidden dynamic dependency (libssl/libcrypto/libsqlite3)"
            exit 1
          fi

  # Dedicated Linux proof that the workspace builds with ONLY the system
  # packages installed below — i.e. no hidden host dependencies on a bare
  # GitHub ubuntu-latest runner.
  #
  # Why these packages (verified 2026-11 against Cargo.lock, keyring 4.2.0):
  #   keyring 4.2's Linux backend in this tree is
  #   zbus-secret-service-keyring-store 1.0.1
  #     -> secret-service 5.2.0  (default `crypto-rust`: pure-Rust crypto
  #        aes/cbc/hkdf/sha2 — no libgcrypt, no OpenSSL)
  #     -> zbus 5.19.0            (pure-Rust D-Bus implementation: speaks the
  #        protocol itself via rustix/linux-raw-sys raw syscalls — it is NOT
  #        a binding to the C libdbus library)
  #   Cargo.lock confirms no *-sys crate in those subtrees links any C
  #   library, so strictly speaking NONE of libdbus-1-dev / libsecret-1-dev
  #   is a compile-time requirement of keyring 4.2's zbus backend.
  #   They are installed here deliberately anyway:
  #     1. They are the historically cited "keyring on Linux" package set
  #        (needed by keyring <= 3.x / secret-service 2.x, which bound C
  #        libdbus/libsecret). Installing them pins that assumption in code
  #        instead of tribal knowledge.
  #     2. If a future change flips the backend or crypto features (e.g.
  #        secret-service's `dbus-secret-service` or `crypto-gcrypt`), the
  #        requirement becomes real and this job already provides it — and
  #        still proves the build on a runner with nothing else added.
  #   pkg-config: genuinely declared by a build dependency in this tree
  #   (libsqlite3-sys, pulled in by rusqlite's `bundled` feature) and is the
  #   standard probe for system C libraries. The rest of the C toolchain
  #   (cc/ar, via build-essential) ships preinstalled on ubuntu-latest.
  #   Note: this proves COMPILE/LINK on bare Linux. Actually talking to a
  #   secret store at RUNTIME would also need a D-Bus session bus + a
  #   secret-service daemon (e.g. gnome-keyring); no test in this workspace
  #   touches the real keychain, so none is provisioned.
  linux-bare:
    name: linux-bare-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install keyring-4.2 Linux system package set
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libdbus-1-dev \
            libsecret-1-dev \
            pkg-config
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: todoist-tui-linux-bare
      - run: cargo build --release

  # EPIC-12 integration & end-to-end verification across Linux and macOS (T-1107).
  # Shares registry/target cache (`shared-key: todoist-tui`); adds ~60-90s wall time.
  integration:
    name: integration
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: todoist-tui
      - run: |
          cargo test --test offline_online_cycle \
            --test security_log_scan \
            --test security_perms \
            --test security_https \
            --test e2e_logout_fresh_start \
            --test docs_sync \
            --test structure_commands \
            --test structure_offline \
            --test structure_tui_e2e \
            --test search_filters

  # EPIC-12 release performance gate checks at 5k cached items (T-1107).
  # Runs on ubuntu-latest only because GitHub macOS virtualized runners exhibit
  # higher scheduling/timer variance on sub-16ms frame latency measurements.
  # Shares `shared-key: todoist-tui`; adds ~90-120s wall time for release build + run.
  perf:
    name: perf
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: todoist-tui
      - run: cargo test --release --test perf_gates -- --ignored --nocapture
      - run: cargo test --release --test tui_perf _5k_items_under_ -- --nocapture
