[package]
name = "todoist-tui"
version = "0.1.0"
edition = "2021"
description = "Terminal UI client for Todoist"
license = "MIT"

# Single binary target (binary crate, no workspace).
[[bin]]
name = "todoist-tui"
path = "src/main.rs"

[dependencies]
# TUI + terminal I/O (ratatui 0.30 backend uses crossterm 0.29)
ratatui = "0.30"
crossterm = "0.29"

# Async runtime
tokio = { version = "1.54", features = ["rt-multi-thread", "macros"] }

# HTTP — rustls only, never OpenSSL (REQ-001)
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# Local storage — bundled SQLite, no system libsqlite3 needed
rusqlite = { version = "0.41", features = ["bundled"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# OS keychain for the API token (macOS: keychain; Linux: secret-service via zbus; Windows: credential manager)
keyring = "4.2"

# IDs
uuid = { version = "1.29", features = ["v4"] }

# Logging / tracing
tracing = "0.1"
tracing-subscriber = "0.3"
tracing-appender = "0.2"

# Error handling
thiserror = "2.0"
anyhow = "1.0"

# CLI parsing
clap = { version = "4.6", features = ["derive"] }

# Config file parsing
toml = "1.1"

# Platform config/data directories
directories = "6.0"
