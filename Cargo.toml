[package]
name = "todoist-tui"
version = "0.1.0"
edition = "2021"
description = "Terminal UI client for Todoist"
license = "MIT"
readme = "README.md"
# Placeholder slug — matches the <owner>/todoist-tui convention already used
# in README.md's install instructions (T-1108). Update once the repo has a
# real home.
repository = "https://github.com/example-org/todoist-tui"
homepage = "https://github.com/example-org/todoist-tui"
documentation = "https://github.com/example-org/todoist-tui#readme"
keywords = ["todoist", "tui", "terminal", "productivity", "cli"]
categories = ["command-line-utilities"]
# Matches the pinned stable toolchain in rust-toolchain.toml (informational
# only — rust-toolchain.toml remains the enforced pin, this field is not
# edited here).
rust-version = "1.99.1"
# Keep `cargo package` lean: docs/, .sdlc/ tooling and test fixtures are not
# part of the shipped crate.
exclude = [
    "docs/",
    ".sdlc/",
    "tests/",
    ".github/",
]

# Single binary target (binary crate, no workspace).
[[bin]]
name = "todoist-tui"
path = "src/main.rs"

[dependencies]
# TUI + terminal I/O (ratatui 0.30 backend uses crossterm 0.29)
ratatui = "0.30"
crossterm = "0.29"

# Async runtime
tokio = { version = "1.54", features = ["rt-multi-thread", "macros"] }

# HTTP — rustls only, never OpenSSL (REQ-001)
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# Local storage — bundled SQLite, no system libsqlite3 needed
rusqlite = { version = "0.41", features = ["bundled"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# OS keychain for the API token (macOS: keychain; Linux: secret-service via zbus; Windows: credential manager)
keyring = "4.2"

# IDs
uuid = { version = "1.29", features = ["v4"] }

# Logging / tracing. tracing-subscriber's `env-filter` feature is required
# for the RUST_LOG-driven `EnvFilter` (T-006); the pin stays major-only "0.3".
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"

# Error handling
thiserror = "2.0"
anyhow = "1.0"

# CLI parsing
clap = { version = "4.6", features = ["derive"] }

# Config file parsing
toml = "1.1"

# Platform config/data directories
directories = "6.0"

# Lint policy (T-002, EPIC-01). Groups stay at warn so later epics keep
# compiling; only the unwrap/expect pair is denied, and only in non-test
# code (scoped via clippy.toml `allow-unwrap-in-tests` / `allow-expect-in-tests`,
# equivalent to a crate-level `#![cfg_attr(test, allow(...))]` without
# touching src/*.rs). Thresholds live in clippy.toml.
# NOTE: groups carry negative `priority` so the individual lints below win
# over the group level (clippy::lint_groups_priority under -D warnings).
[lints.rust]
unsafe_code = "forbid"
rust_2018_idioms = { level = "warn", priority = -1 }

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -2 }
# A TUI must survive bad data: no blind `.unwrap()` / `.expect(...)` in
# production code. Return errors instead (T-003 hierarchy).
unwrap_used = "deny"
expect_used = "deny"

[dev-dependencies]
# HTTP mocking for T-106's wiremock-based status-mapping tests.
wiremock = "0.6"

# Shared integration-test harness (T-1101, EPIC-12): isolated temp HOME/XDG
# dirs removed on drop. Process spawning uses std::process::Command, so
# assert_cmd/predicates are deliberately not added.
tempfile = "3"

